about: |
  ## What this is

  The Reboot plugin teaches Claude how to build an app on Reboot: what to ask, how to design the domain model, which Reboot rules to follow, and how to test and run the result. Upstream ships it as part of Reboot. For several weeks a fork of it, the [`ia-restructure`](https://github.com/mtrifiro/reboot-plugin/tree/ia-restructure) branch of reboot-plugin, gathered what real builds taught: [hundreds of findings](/kind/finding), corrections to what the skills say about Reboot, templates, guard hooks, checks, and a much more scripted conversation.

  ## Why it is being rebuilt

  A full build on the shipped plugin, 1.6.0 ([hotel-6](/builds/94861fa0-b0c3-40af-bcc9-6f644670cd79), in the Claude app), showed what the fork had lost. 1.6.0 asked 3 questions, showed the whole design in plain language 49 seconds after the last answer, proposed the features instead of asking for them, and had a scenario passing in about 10 minutes. The fork's welcome, framed reports, step lines and the hooks that enforce them made each build slower and heavier, and its reading path grew from 37,127 to 46,687 words. Most of what the fork got right is knowledge, not conversation.

  ## How the rebuild works

  The rebuild starts from upstream as it is now, reboot main after [reboot#186](https://github.com/reboot-dev/reboot/pull/186), which had already taken in several of the fork's findings. What the fork learned is ported in underneath, in seven layers: measurement, corrections, knowledge read only when needed, mechanisms that cost no reading, two changes to the experience, deploy, and packaging for the Claude app. Ten parts of the fork are left out until a build shows they help.

  ## How each layer is judged

  A [hotel build](/builds) on the plugin with that layer in must be no worse than the baseline on the four numbers that matter to the person waiting: questions before code, and the active time to the design, to the API file and to the first passing scenario. The time spent answering questions doesn't count against a build. The words a build reads before writing code are capped at main's count and may only go down.

  ## The repositories and branches

  Six places keep the project going, and each has one job. One is the base next starts from. One is where the work happens. One is where the learnings come from. The rest are reference points and this tracker.

  ### Based on: upstream

  - [`reboot-dev/reboot`](https://github.com/reboot-dev/reboot), branch `main`. The Reboot monorepo, and the plugin's real source in [`reboot/plugin/`](https://github.com/reboot-dev/reboot/tree/main/reboot/plugin). Upstream merges skill changes here, as it did [reboot#186](https://github.com/reboot-dev/reboot/pull/186). next starts from main at [`8b87909`](https://github.com/reboot-dev/reboot/commit/8b879091). Your clone of it is `~/projects/reboot`, whose `origin` is reboot-dev and `fork` is [`mtrifiro/reboot`](https://github.com/mtrifiro/reboot). Its own `main` is left untouched.
  - [`reboot-dev/reboot-plugin`](https://github.com/reboot-dev/reboot-plugin), branch `main`. Only a mirror: upstream copies `reboot/plugin/` into it at each release. Its [`1f4f7bf`](https://github.com/reboot-dev/reboot-plugin/commit/1f4f7bf) is 1.6.0, the plugin hotel-6 ran. Nothing is based on it anymore.

  ### Worked in: next and its layer branches

  - `next`, in `~/projects/reboot-next`. A worktree of `~/projects/reboot` with only `reboot/plugin/` checked out. It holds main plus every finished layer, the local marketplace name `reboot-next`, and the plan and this record in `reboot/plugin/docs/`. It is the plugin `~/projects/next-test` loads and the Claude app upload is built from. It never goes upstream as it is.
  - `next-l<N>-<name>`, one per layer, such as `next-l0-measurement`. Each starts from reboot main and holds only that layer's commits, never `docs/` or the marketplace name. Pushed to [`mtrifiro/reboot`](https://github.com/mtrifiro/reboot), each becomes a [pull request to reboot-dev/reboot](https://github.com/reboot-dev/reboot/pulls). None is pushed yet.

  ### Worked from: the fork

  - [`mtrifiro/reboot-plugin`](https://github.com/mtrifiro/reboot-plugin), branch [`ia-restructure`](https://github.com/mtrifiro/reboot-plugin/tree/ia-restructure), in `~/projects/reboot-plugin`. [248 commits](/changes) on 1.6.0, open as [pull request 2](https://github.com/mtrifiro/reboot-plugin/pull/2) on the fork. It is the source of the learnings: [findings](/kind/finding), corrections, [references](/kind/reference), [templates](/kind/template), guards and [tools](/kind/tool). Items are ported from it by hand, one at a time, and never merged. It stays as it is, and the [Plugin Browser browses it](/).

  ### Reference points and this tracker

  - `~/projects/reboot-plugin-main`, a clone of reboot-dev/reboot-plugin at 1.6.0 on the branch `local-marketplace-name`, installed as `reboot-main` in `~/projects/main-test`. It is how [hotel-6](/builds/94861fa0-b0c3-40af-bcc9-6f644670cd79)'s plugin can be run again.
  - `~/projects/reboot-next-1.6.0`, the first draft of next on 1.6.0, before reboot#186 moved the base. Nothing in it is committed, and it can be deleted.
  - [`mtrifiro/plugin-browser`](https://github.com/mtrifiro/plugin-browser), branch `master`, in `~/projects/plugin-browser`. This tracker, on ports 9600 and 4600. It reads the other checkouts and never writes them.

  ### Which plugin runs where

  - Claude Code, everywhere by default: the fork, `reboot@reboot-plugin`.
  - `~/projects/main-test`: 1.6.0, `reboot@reboot-main`.
  - `~/projects/next-test`: next, `reboot@reboot-next`, read live from the worktree.
  - The Claude app: whatever was uploaded last. For hotel-7 that is `~/Downloads/reboot-next-main.plugin`, built from next at `ff5ce080`, main plus the marketplace name.

strategy: |
  ## The strategy, in plain English

  ### Keep what already worked

  The shipped plugin talks to you well. It asks few questions, shows the whole design in plain words before any code, and offers recommendations you can simply accept. That stays exactly as it is.

  ### Put the lessons underneath

  The fork learned real things about Reboot: where the skills were wrong, which errors builds hit and how to fix them, and checks that catch mistakes early. Those go where a build only meets them when it needs them. A correction goes into the file that was wrong. Error fixes go into a list a build searches. Checks and guards run by themselves.

  ### Prove every change with a real build

  Nothing comes back on a hunch. After each layer, the same hotel prompt is built again and compared with the baseline. If the build asks more questions or takes longer to reach the design, the API or a passing scenario, the layer is not done.

  ### Spend no extra reading

  Every word a build reads costs time on every turn after it. The total is capped at what main reads today, and it can only go down. A layer that adds words has to cut as many somewhere else.

  ### Send it upstream in small pieces

  Each layer becomes its own small pull request to Reboot, the same shape as the fixes upstream already took in reboot#186. The Reboot team can take what helps and leave the rest, and nothing depends on one large merge.

  ### Leave the ceremony out until it earns its place

  The welcome, the framed reports, the step lines and the progress band stay out. Any of them can come back, but only when a build shows it helps you.

done:
  - Measured the baseline. [hotel-6](/builds/94861fa0-b0c3-40af-bcc9-6f644670cd79), the hotel prompt on 1.6.0 in the Claude app, asked 3 questions, showed the design after 49 s, wrote the API file after 5 m 31 s, had its first scenario passing after 10 m 03 s, and reached 39 passing scenarios.
  - Wrote the plan, `docs/next-plan.md`, and this record. They list the seven layers, 29 items to port from the fork, 10 parts left out, and the decisions with their reasons.
  - Read [reboot#186](https://github.com/reboot-dev/reboot/pull/186) against the plan, and moved next onto reboot main. The plugin's source is `reboot/plugin/` in the reboot monorepo, so `~/projects/reboot-next` is now a worktree of `~/projects/reboot` on the branch `next`. Two L1 items were already fixed there and are skipped. The `OAuth` import, the reserved method names and the frontend version pins are still open.
  - Built L0's tools on `next`, and cut `next-l0-measurement` from main with only them. `tools/budget.py --check` holds the reading path under main's 38,116 and 48,769 words. `tools/check-transcript.py` reads a build's numbers and compares them with a baseline. `tools/check.sh` runs both checks plus the manifests.
  - Checked the measures against known numbers. The budget reproduces 1.6.0's 37,127 and 48,306 words exactly. The transcript checker reproduces hotel-6's numbers.
  - Prepared hotel-7. Claude Code loads next's 10 skills and hooks in `~/projects/next-test`, with the fork and 1.6.0 turned off there. The upload for the Claude app is built at `~/Downloads/reboot-next-main.plugin`, the same way the 1.6.0 upload was.
  - Added this Next page to the Plugin Browser. It reads the record on every visit and never writes it. It judges each build against the baseline from its transcript, and shows any plugin file in upstream main, next and the fork.

  - Ran hotel-7, the same prompt on main's plugin in the Claude app, and made it the baseline. Against hotel-6 on 1.6.0 it asked 4 questions instead of 3, wrote the API file after 6 m 30 s instead of 5 m 31 s, and had its first scenario passing after 14 m 26 s instead of 10 m 03 s. It read fewer words before the API, 34,671 against 46,179. The fourth question was the production sign-in provider, noted as L1's `provider-at-deploy`.
  - Rebuilt L0 the way upstream tests the plugin, after a senior-engineer review of the first version. `next-l0-budget` is a Bazel test that the reading lists name real files and the reading path stays under a ceiling. `next-l0-build-metrics` reads a build's numbers from Claude Code or Codex transcripts. Both live under `tests/`, so nothing ships to users.
  - Wrote the `agents-md` skill Ben asked for: every Reboot app gets an `AGENTS.md` and a `CLAUDE.md` that imports it, for new apps, changes and existing apps through `run`. Tested on copies of hotel-6.
  - Ran L0's two Bazel tests for the first time. Both passed, but Bazel's mypy check failed on their bare imports. They now import by full path, as upstream's tests do, and pass the pinned yapf and isort. Merged into next.
  - Measured the map. Eight sessions did the same follow-up task with and without `AGENTS.md`, in Claude Code and in Codex. Every one passed its suite, and time and tool calls were the same either way. Four more sessions had a deliberately stale map: they passed in the same time, each wrong path cost one failed lookup, and three of the four repaired the map unasked.
  - Found that builds made with main's or next's plugin hang in tests on Apple Silicon. Their apps install the released `reboot==1.6.0`, whose Envoy keeps LuaJIT on, which pins a CPU after a restart. Upstream fixed it in `envoy_config.py` ([e1b8ee9f](https://github.com/reboot-dev/reboot/commit/e1b8ee9f), [reboot#189](https://github.com/reboot-dev/reboot/pull/189), merged 2026-10-09), and next's tree already has it, but no release carries it yet. The fork's `uv` shim patches the installed wheel; until a release, measured runs patch the venv.
  - Opened [reboot#235](https://github.com/reboot-dev/reboot/pull/235), the `agents-md` skill, with the measurements in its description, [reboot#241](https://github.com/reboot-dev/reboot/pull/241), the reading budget, and [reboot#242](https://github.com/reboot-dev/reboot/pull/242), the build measure. All three are ready for review; none has a review yet.
next:
  - step: Port the evals that test substance. That finishes L0.
    why: A hotel build is one run of one prompt. Evals run many prompts with and without the plugin, so a layer's effect can be told from chance.
  - step: L1, the corrections still open on main. The `OAuth` import, the reserved method names, the API facts, the production provider asked at deploy, and the frontend version pins. Then a hotel build against hotel-7.
    why: hotel-7 asked one more question than 1.6.0 and took longer to its first passing scenario. These corrections target exactly those costs.

decisions:
  - date: 2026-10-11
    title: Start from upstream 1.6.0 on branch next
    why: >-
      hotel-6 showed 1.6.0 faster, with a fuller plain-language design and
      fewer questions. The fork's gains are in correctness and mechanisms,
      which port underneath without the conversation layer. Each layer is a
      branch off next, so it can become an upstream PR.
  - date: 2026-10-11
    title: The Flywheel brand, light
    why: >-
      A stage heading on the design message and on the handoff only. No
      reports, step lines or progress band.
  - date: 2026-10-11
    title: 1.6.0's own voice, no voice rules for now
    why: >-
      hotel-6's design read well without them. Revisit once the layers are in.
  - date: 2026-10-11
    title: Next lives in the reboot monorepo, from main after reboot#186
    why: >-
      The plugin's source is reboot/plugin/ in reboot-dev/reboot; the
      reboot-plugin repo only mirrors releases. reboot#186 had already
      landed several of the fork's findings there. next is a worktree of
      ~/projects/reboot from main 8b87909, so each layer becomes a PR to
      reboot-dev/reboot, shaped like #186.
  - date: 2026-10-11
    title: Track the rebuild in the Plugin Browser
    why: >-
      Its Builds, Compare to main and Ask Claude already cover most of what
      tracking needs. This file is the record, so git keeps the history.

layers:
  - id: L0
    title: Measurement
    goal: Measure every later layer against hotel-6, with no change for the user.
    branch: next-l0-budget
    # L0 changes nothing a build reads, so hotel-7, on main, tests it.
    builds: [9672c2aa-fa35-4516-b7f5-f6c0d95f7d1f]
    items:
      - id: budget
        title: Reading budget as a Bazel test, with ceilings
        why: >-
          The fork's path grew from 37,127 to 46,687 words. Hard ceilings at
          1.6.0's counts, only moving down, make every addition pay for itself.
        fork: [tools/budget.py, tools/reflib.py]
        target: [tests/reboot/plugin/reading_budget/]
        status: ported
        commit: 8879b7f4
      - id: evals
        title: Evals that test substance
        why: >-
          Design, correctness and accept cases, with and without the plugin.
          The graders for reports, welcome and voice stay behind.
        fork: [tools/run-evals.sh, evals/README.md]
        target: [tools/run-evals.sh, evals/]
        status: to do
      - id: check-transcript
        title: Build measure from Claude Code and Codex transcripts
        why: Measures a real build the same way every time.
        fork: [tools/check-transcript.py]
        target: [tests/reboot/plugin/build_metrics/]
        status: ported
        commit: 6d1f3dd2
      - id: checks
        title: Lint and unit checks, with shellcheck
        why: >-
          Skipped: upstream CI runs `bazel test` and its own linters, so a
          parallel check script would be a second CI. L0's checks are Bazel
          tests instead.
        fork: [tools/check.sh, tools/check.py]
        target: [tools/check.sh]
        status: skipped
        commit: none
      - id: marketplace-name
        title: A local marketplace named reboot-next
        why: Installs beside the fork and 1.6.0. Never upstreamed.
        fork: []
        target: [.claude-plugin/marketplace.json]
        status: ported
        commit: ff5ce080

  - id: L1
    title: Corrections
    goal: Fix what 1.6.0 says that is wrong, in the files that say it.
    branch: next-l1-corrections
    builds: []
    items:
      - id: authorizers
        title: Real authorizers from the first stub
        why: >-
          1.6.0 says omit authorizer(), but its Reboot() test harness denies
          those calls with PermissionDenied.
        fork: [skills/python/references/servicer-authorizer.md]
        target: [skills/web-app/SKILL.md, skills/python/references/servicer-authorizer.md]
        status: skipped
        commit: reboot#186
      - id: oauth-import
        title: The missing OAuth import
        why: The web-app auth example uses OAuth without importing it from reboot.aio.auth.oauth.
        fork: [skills/build/SKILL.md]
        target: [skills/web-app/SKILL.md]
        status: to do
      - id: allowed-origins
        title: allowed_origins outside rbt dev run
        why: Dev auto-allows localhost and hides the gap until the first deploy.
        fork: [skills/build/SKILL.md]
        target: [skills/web-app/SKILL.md]
        status: skipped
        commit: reboot#186
      - id: reserved-names
        title: Reserved method names
        why: hotel-6 hit schedule at rbt generate. Said before the API is written, it costs no retry.
        fork: [skills/python/references/rpc-refs.md]
        target: [skills/python/references/rpc-refs.md]
        status: to do
      - id: api-facts
        title: The API facts
        why: >-
          Non-zero Field defaults are refused, mcp= is required, no
          list[Entity] on a parent, self.ref().state_id, no state in
          __init__, writers can't call writers, reader changes are discarded,
          initialize runs once per lifetime, .rbtrc is line-based, allow_if
          takes all or any.
        fork: [skills/web-app/SKILL.md]
        target: [skills/web-app/SKILL.md, skills/mcp-ui/SKILL.md]
        status: to do
      - id: provider-at-deploy
        title: Ask for the production sign-in provider at deploy, not at design
        why: >-
          hotel-7 on main asked for the production provider in its first
          round of questions, a fourth question hotel-6 never asked. Main's
          skills say to choose it before real users exist, and the build read
          that as before the design. In development the provider is always
          the built-in account picker, and main's own setup is prod=None until
          one is chosen, so the choice belongs to the deploy skill. The design
          says prod=None and names the choice in one line, as hotel-6 did.
          Noted 2026-10-12, to do after hotel-7.
        fork: []
        target: [skills/web-app/SKILL.md, skills/mcp-ui/SKILL.md, skills/deploy/SKILL.md]
        status: to do
      - id: vite-pins
        title: Version pins for the frontend shell
        why: npm create vite now emits React 19 and TypeScript 6.
        fork: [skills/build/SKILL.md]
        target: [skills/web-app/SKILL.md]
        status: to do

  - id: L1b
    title: Both front doors
    goal: >-
      Every backend is ready for an MCP UI and a web app, so a build with
      no front door named starts without asking which.
    branch: next-l1b-both-front-doors
    builds: []
    items:
      - id: web-first
        title: The web app first when the prompt names no front door, the MCP UI offered at handoff
        why: >-
          Main asks which kind of app when the prompt names none. hotel-7 asked
          it first, one of its four questions. With every backend ready for
          both, the wrong guess no longer costs a rebuild, only the other
          front door added later.
        fork: [skills/app/SKILL.md]
        target: [skills/app/SKILL.md]
        evals: [route-default-todo/web-first, route-default-crm/web-first, route-default-todo/mcp-ready, route-default-crm/mcp-ready, route-mcp/web-ready]
        status: to do
      - id: user-type
        title: A User type in every design
        why: >-
          Main's web-app declares a User type only for per-user state, so an
          MCP UI added later means reworking the backend. One User per
          identity serves both front doors.
        fork: [skills/build/SKILL.md, skills/web-app/SKILL.md]
        target: [skills/web-app/SKILL.md]
        evals: [design-ready-for-both/user-type]
        status: to do
      - id: ai-roles
        title: Each method's AI role, and descriptions written for an AI caller
        why: >-
          A method's description is schema and can't be reworded after
          deploy; its mcp= exposure can change. Writing descriptions for an
          AI from the start keeps the MCP UI a later addition, not a migration.
        fork: [skills/build/SKILL.md]
        target: [skills/web-app/SKILL.md, skills/mcp-ui/SKILL.md]
        evals: [design-ready-for-both/ai-roles, design-ready-for-both/ai-descriptions]
        status: to do

  - id: L2
    title: Knowledge
    goal: What a build reads only when it needs it.
    branch: next-l2-knowledge
    builds: []
    items:
      - id: errors-md
        title: errors.md, about 258 error strings with cause and fix
