        why: LuaJIT pins Envoy on arm64 Macs, and rbt generate dies with ENOBUFS on large APIs. Both are fixed upstream but not released (LuaJIT in reboot#189, merged; ENOBUFS in reboot#232, open), so the patches are needed only until apps can pin a release that has them.
