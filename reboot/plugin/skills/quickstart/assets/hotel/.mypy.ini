# .mypy.ini — documented at
#   https://mypy.readthedocs.io/en/stable/config_file.html
[mypy]
warn_unused_configs = True

# Find modules in our source tree (and tests). Since `protoc` doesn't
# generate `__init__.py` files, treat these as explicit package bases.
mypy_path = tests:backend/src:backend/api:api:scripts
explicit_package_bases = True

check_untyped_defs = True
strict_equality = True

[mypy-google.api.*]
ignore_missing_imports = True
[mypy-google.rpc.*]
ignore_missing_imports = True
[mypy-grpc.*]
ignore_missing_imports = True
[mypy-grpc_status.*]
ignore_missing_imports = True

# Don't check generated code: one entry per API package.
[mypy-hotel.v1.hotel_rbt,rooms.v1.rooms_rbt,reservations.v1.reservations_rbt,staff.v1.staff_rbt]
ignore_errors = True
